  <!-- QA_ANNOTATION_HTML_START: 离线批注模式，导出发布版时会被移除。 -->
  <button class="qa-launcher" type="button" id="qaLauncher" aria-controls="qaSidebar" aria-expanded="false" data-qa-ui>
    <span class="qa-launcher-label" id="qaLauncherLabel">批注</span>
    <span class="qa-launcher-count" id="qaLauncherCount" hidden>0</span>
  </button>

  <div class="qa-selection-popover" id="qaSelectionPopover" role="menu" aria-label="选中文本操作" data-qa-ui>
    <button class="qa-bubble-btn primary" type="button" id="qaSelectionQuestionAction" data-qa-action="question-selection" title="添加问题">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M9.8 9a2.4 2.4 0 0 1 4.4 1.35c0 1.65-2.2 1.85-2.2 3.35"></path><path d="M12 17h.01"></path></svg>
      <span id="qaSelectionQuestionLabel">问题</span>
    </button>
    <button class="qa-bubble-btn" type="button" id="qaSelectionAction" data-qa-action="comment-selection" title="添加评论">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg>
      <span id="qaSelectionActionLabel">评论</span>
    </button>
  </div>

  <div class="qa-composer" id="qaComposer" role="dialog" aria-label="添加问题或评论" data-qa-ui>
    <p class="qa-composer-title" id="qaComposerTitle"></p>
    <p class="qa-composer-excerpt" id="qaComposerExcerpt"></p>
    <textarea id="qaComposerText" placeholder="写下问题或评论"></textarea>
    <div class="qa-composer-actions">
      <button class="qa-small-btn primary" type="button" id="qaComposerSave" aria-keyshortcuts="Meta+Enter Control+Enter" title="提交（Ctrl/⌘ + Enter）">
        <span class="qa-submit-label">提交</span>
        <kbd class="qa-shortcut-hint" aria-hidden="true">Ctrl/⌘ + Enter</kbd>
      </button>
    </div>
  </div>

  <div class="qa-context-menu" id="qaContextMenu" role="menu" aria-label="批注右键菜单" data-qa-ui>
    <button class="qa-menu-item" type="button" data-qa-action="question-selection">对选中内容添加问题</button>
    <button class="qa-menu-item" type="button" data-qa-action="comment-selection">对选中内容添加评论</button>
    <div class="qa-menu-sep"></div>
    <button class="qa-menu-item" type="button" data-qa-action="question-block">对本段添加问题</button>
    <button class="qa-menu-item" type="button" data-qa-action="comment-block">对本段添加评论</button>
    <div class="qa-menu-sep"></div>
    <button class="qa-menu-item" type="button" data-qa-action="question-section">对本节添加问题</button>
    <button class="qa-menu-item" type="button" data-qa-action="comment-section">对本节添加评论</button>
  </div>

  <aside class="qa-sidebar" id="qaSidebar" aria-label="报告批注" data-qa-ui>
    <div class="qa-sidebar-header">
      <div class="qa-title-row">
        <h2>批注</h2>
        <span class="qa-mode-chip">批注模式</span>
        <button class="qa-close" type="button" id="qaClose" aria-label="关闭批注栏">×</button>
      </div>
      <p class="qa-help">按轮次交接：问题或解释请求直接回答；只有用户明确要求修改批注、报告或 HTML 时才修改同一份 HTML 并写入处理回执。</p>
      <div class="qa-round-status" id="qaRoundStatus" role="status" aria-live="polite"></div>
      <div class="qa-actions">
        <button class="qa-primary-btn qa-copy-agent-btn qa-wide" type="button" id="qaCopyForAgent" aria-disabled="true" title="请先添加问题或评论后再复制给 Agent">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
          复制批注给 Agent
        </button>
        <div class="qa-secondary-actions" role="group" aria-label="批注文件操作">
          <button class="qa-secondary-btn" type="button" id="qaSaveReviewHtml" aria-label="保存批注版 HTML（备用）" title="保存批注版 HTML（备用）">保存批注版</button>
          <button class="qa-secondary-btn" type="button" id="qaExportPublic">导出发布版</button>
        </div>
        <button class="qa-danger-btn qa-clear-btn qa-wide" type="button" id="qaClearAll">清空本轮</button>
      </div>
    </div>
    <div class="qa-list" id="qaList"></div>
  </aside>

  <div class="qa-copy-backdrop" id="qaCopyBackdrop" role="dialog" aria-modal="true" aria-labelledby="qaCopyTitle" data-qa-ui>
    <div class="qa-copy-dialog">
      <div class="qa-dialog-head"><h2 id="qaCopyTitle">手动复制</h2></div>
      <div class="qa-dialog-body">
        <p class="qa-help">当前浏览器没有开放剪贴板权限。下面内容已选中，可以直接按 Cmd+C 复制。</p>
        <textarea class="qa-copy-textarea" id="qaCopyTextarea" readonly></textarea>
      </div>
      <div class="qa-dialog-actions">
        <button class="qa-primary-btn" type="button" id="qaCopyClose">完成</button>
      </div>
    </div>
  </div>
  <!-- QA_ANNOTATION_HTML_END -->
