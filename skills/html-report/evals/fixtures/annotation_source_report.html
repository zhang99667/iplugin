<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>示例技术报告</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: #1f2937;
      background: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.6;
    }
    .report-shell {
      width: min(960px, calc(100% - 32px));
      margin: 0 auto;
      padding: 32px 0;
    }
    .summary {
      border: 1px solid #d8e0ea;
      background: #ffffff;
      border-radius: 8px;
      padding: 20px;
    }
    .table-wrap {
      overflow-x: auto;
      margin-top: 16px;
      border-radius: 12px;
    }
    .table-wrap table:not(.diff-table) {
      width: 100%;
      min-width: 560px;
      border-collapse: collapse;
      background: #ffffff;
    }
    .table-wrap table:not(.diff-table) th,
    .table-wrap table:not(.diff-table) td {
      border: 1px solid #d8e0ea;
      padding: 10px 12px;
      text-align: left;
      vertical-align: top;
    }
    code {
      overflow-wrap: anywhere;
      background: #eef2f7;
      border-radius: 4px;
      padding: 0 4px;
    }
    @media (max-width: 720px) {
      .report-shell {
        width: min(100% - 20px, 960px);
        padding: 20px 0;
      }
    }
    @media print {
      body {
        background: #ffffff;
      }
      .report-shell {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="report-shell">
    <header>
      <p>文档类型：技术报告</p>
      <h1>HTML 报告单一真源示例</h1>
    </header>
    <section class="summary">
      <h2>TL;DR</h2>
      <p>本报告用于验证普通 HTML 在注入批注模式前后的校验链路。</p>
    </section>
    <section>
      <h2>验证范围</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>项目</th>
              <th>要求</th>
              <th>状态</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>基础校验</td>
              <td>运行 <code>check_html_report.py</code></td>
              <td>待执行</td>
            </tr>
            <tr>
              <td>批注注入</td>
              <td>运行 <code>inject_annotation_mode.py</code></td>
              <td>待执行</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>
</body>
</html>
